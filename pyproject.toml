    "anthropic>=0.40.0",
    "accelerate>=1.13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "httpx>=0.27",
    "openai>=1.0.0",
    "peft>=0.12",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "supabase>=2.0.0",
    "torch>=2.6.0",
    "tqdm>=4.0",
    "transformers>=5.5.0",
    "numpy>=1.26",
    "matplotlib>=3.10.8",
    "trl>=0.17",
