[project]
name = "probe-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "httpx>=0.27",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "supabase>=2.0.0",
    "tqdm>=4.0",
    "numpy>=1.26",
    "matplotlib>=3.10.8",
    # Training / inference deps — Linux/GPU only
    "torch>=2.6.0; sys_platform == 'linux'",
    "accelerate>=1.13.0; sys_platform == 'linux'",
    "transformers>=5.5.0; sys_platform == 'linux'",
    "trl>=0.17; sys_platform == 'linux'",
    "unsloth>=2025.4; sys_platform == 'linux'",
    "deepspeed>=0.18.9; sys_platform == 'linux'",
    "vllm-probe-plugin; sys_platform == 'linux'",
    # Backend server
    "fastapi[standard]>=0.110.0; sys_platform == 'linux'",
    "uvicorn[standard]>=0.29.0; sys_platform == 'linux'",
    "uvloop>=0.17.0; sys_platform == 'linux'",
    "modal>=1.4.2",
]

[tool.setuptools.packages.find]
where = ["."]


[tool.uv.sources]
vllm-probe-plugin = { path = "../vllm_probe_plugin", editable = true }

[tool.uv]
# Keep transformers on v5.x so the resolver does not downgrade below Gemma 4 requirements.
override-dependencies = [
    "transformers>=5.5.0",
]
# Only resolve wheels for the current platform — prevents uv failing on macOS
# when Linux-only CUDA packages (e.g. nvidia-cudnn-frontend) have no macOS wheel.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
