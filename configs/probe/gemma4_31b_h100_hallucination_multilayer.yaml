# Profile: google/gemma-4-31B-it on one NVIDIA H100 (80GB), multi-layer CovSeq probe.
# Extracts hidden states from 8 layers spanning the full depth of the model.
# Each layer gets its own independent L/R CovSeq compressors; all pooled covariance
# matrices are concatenated and fed through a single MLP for the final probe score.
#
# Memory note: extracting 14 layers adds ~14x the hidden-state buffer vs single-layer.
# At BF16, 4096 tokens, hidden_size=5376: ~14 * 4096 * 5376 * 2 ≈ 616MB extra per seq.
# This is well within the ~12GB KV headroom on H100 with gpu_memory_utilization=0.85.

# ── Model / vLLM ───────────────────────────────────────────────────────────
model_name: google/gemma-4-31B-it
dtype: "auto"

max_model_len: 1536 # under 2% of entries are longer than this in the gemma4 hallucinations dataset
gpu_memory_utilization: 0.90
tensor_parallel_size: 1

trust_remote_code: true

chat_template_kwargs:
  enable_thinking: false

lora_present: false
lora_path: output/lora_adapter/

# ── Probe head ─────────────────────────────────────────────────────────────
probe:
  probe_model_type: multi_layer_covseq
  # Every 4 layers from 5 to 57 across Gemma 4 31B's 60 layers (indices 0–59): 14 layers total.
  layer_indices: [5, 9, 13, 17, 21, 25, 29, 33, 37, 41, 45, 49, 53, 57]
  hidden_sizes: [256]
  output_size: 1
  covseq:
    window_size: 16
    compressed_size: 64
    training_metrics_interval_epochs: 1.0

# ── Data ───────────────────────────────────────────────────────────────────
annotations_jsonl: data/annotated.jsonl
val_fraction: 0.1
pos_weight: auto
pos_weight_max: null

# ── Training ───────────────────────────────────────────────────────────────
epochs: 3
train_batch_size: 16
grad_accumulation_steps: 8
probe_lr: 1.0e-3
warmup_steps: 50
max_grad_norm: 1.0
val_interval: 100
log_interval: 1
checkpoint_interval: 50

output_dir: output/gemma4_31b_hallucination_probe_multilayer_v2
seed: 42
