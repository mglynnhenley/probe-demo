# Profile: google/gemma-4-31B-it on one NVIDIA H100 (80GB), multi-layer CovSeq probe
# trained on the SimpleQA + TriviaQA factuality mix (75/25).
#
# Build the dataset first:
#   uv run python process_scripts/build_factuality_dataset.py
#   uv run python annotation_pipeline/local_generate.py \
#       --input  data/generations.jsonl \
#       --output data/local_generations.jsonl \
#       --backend-url http://<gemma-backend>/v1
#   uv run python annotation_pipeline/annotate_hallucinations.py \
#       --input  data/local_generations.jsonl \
#       --output data/annotated.jsonl \
#       --backend anthropic --batch --web-search --model claude-sonnet-4-6
#
# Then:
#   uv run python train/train.py configs/probe/gemma4_31b_simpleqa_multilayer.yaml

# ── Model / vLLM ───────────────────────────────────────────────────────────
model_name: google/gemma-4-31B-it
dtype: "auto"

max_model_len: 4096
gpu_memory_utilization: 0.85
tensor_parallel_size: 1

# layer_idx is unused for multi_layer_covseq but must be a valid layer (kept for config compat).
layer_idx: 45

trust_remote_code: true

chat_template_kwargs:
  enable_thinking: false

lora_present: false
lora_path: output/lora_adapter/

# ── Probe head ─────────────────────────────────────────────────────────────
probe:
  probe_model_type: multi_layer_covseq
  # Every 4 layers from 5 to 57 across Gemma 4 31B's 60 layers (indices 0-59): 14 layers total.
  layer_indices: [5, 9, 13, 17, 21, 25, 29, 33, 37, 41, 45, 49, 53, 57]
  hidden_sizes: [256]
  output_size: 1
  covseq:
    window_size: 16
    compressed_size: 64
    training_metrics_interval_epochs: 1.0

# ── Data ───────────────────────────────────────────────────────────────────
annotations_jsonl: data/annotated.jsonl
val_fraction: 0.1
pos_weight: auto
pos_weight_max: null

# ── Training ───────────────────────────────────────────────────────────────
epochs: 4
train_batch_size: 6
grad_accumulation_steps: 8
probe_lr: 1.0e-3
warmup_steps: 50
max_grad_norm: 1.0
val_interval: 100
log_interval: 1
checkpoint_interval: 50

output_dir: output/gemma4_31b_simpleqa_multilayer
seed: 42
